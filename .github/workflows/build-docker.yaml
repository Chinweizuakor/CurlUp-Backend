      #     docker push $ECR_REPO:${{ steps.datetime.outputs.datetime }}

      - name: Clean up Docker
        if: always()
        run: |
          docker stop curlup-dev-container || true
          docker rm curlup-dev-container || true
          docker rmi curlup-dev || true