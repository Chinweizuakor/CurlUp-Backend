name: Build and Run CurlUp Container

on:
  workflow_call

jobs:
  Build-Run-Push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate datetime-based tag
        id: datetime
        run: echo "datetime=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t curlup-dev .

      - name: Run Docker container
        run: |
          docker run -d --name curlup-dev-container -p 8000:8000 curlup-dev
          
      - name: Wait for FastAPI to be ready
        run: |
          sleep 5
          for i in {1..10}; do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "FastAPI is up!"
              break
            fi
            echo "Waiting for FastAPI..."
            sleep 5
          done
          # Fail if FastAPI doesn't start
          curl -s http://localhost:8000/docs > /dev/null || exit 1

